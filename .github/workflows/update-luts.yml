name: Update Lookup Tables
on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours, the chain to the latest version
    - cron: '40 3 * * *'  # Daily, every lineage the repository still offers
  workflow_dispatch:
    inputs:
      mode:
        description: Which versions to build. "auto" follows the schedule that triggered the run.
        type: choice
        options: [auto, chain, all]
        default: auto
      slug:
        description: Only run this repository slug. Empty runs all of them.
        type: string
        default: ''
      max_patch_bytes:
        description: Patch bytes one "all" run may download per repository before leaving the rest to the next.
        type: string
        default: '8589934592'

jobs:
  download:
    name: Download LUTs (${{matrix.name}})
    runs-on: ubuntu-latest
    if: ${{github.event.inputs.slug == '' || github.event.inputs.slug == matrix.slug}}
    timeout-minutes: 350

    permissions:
      actions: write
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: 2b5cbc63
          name: global/boot
        - slug: 4e9a232b
          name: global/ffxiv
        - slug: 6b936f08
          name: global/ex1
        - slug: f29a3eb2
          name: global/ex2
        - slug: 859d0e24
          name: global/ex3
        - slug: 1bf99b87
          name: global/ex4
        - slug: 6cfeab11
          name: global/ex5

        - slug: de199059
          name: korea/ffxiv
        - slug: 573d8c07
          name: korea/ex1
        - slug: ce34ddbd
          name: korea/ex2
        - slug: b933ed2b
          name: korea/ex3
        - slug: '27577888'
          name: korea/ex4
        - slug: 5050481e
          name: korea/ex5

        - slug: c38effbc
          name: china/ffxiv
        - slug: 77420d17
          name: china/ex1
        - slug: ee4b5cad
          name: china/ex2
        - slug: 994c6c3b
          name: china/ex3
        - slug: 0728f998
          name: china/ex4
        - slug: 702fc90e
          name: china/ex5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            luts/${{matrix.slug}}
            cluts/${{matrix.slug}}
          sparse-checkout-cone-mode: false

      - name: Download Downloader
        uses: robinraju/release-downloader@v1
        with:
          repository: WorkingRobot/ffxiv-downloader
          fileName: 'xiv-dl-linux-x64'
          latest: true

      - name: Setup Executable
        run: |
          mv xiv-dl-linux-x64 xiv-dl
          chmod +x xiv-dl

      # Folding every lineage is far too much work to repeat every couple of hours, so
      # the frequent run keeps the live version current and the daily one picks up the
      # rest. While the older lineages are still being filled in a budget keeps one run
      # finite; it spends that budget oldest first, because a CLUT needs every LUT
      # before it in its lineage.
      - name: Choose mode
        id: mode
        env:
          SCHEDULE: ${{github.event.schedule}}
          REQUESTED: ${{github.event.inputs.mode}}
          BUDGET: ${{github.event.inputs.max_patch_bytes}}
        run: |
          mode="$REQUESTED"
          if [ -z "$mode" ] || [ "$mode" = auto ]; then
            if [ "$SCHEDULE" = '40 3 * * *' ]; then mode=all; else mode=chain; fi
          fi
          if [ "$mode" = all ]; then
            echo "lut_args=--all-versions --max-patch-bytes ${BUDGET:-8589934592}" >> $GITHUB_OUTPUT
            echo "clut_args=--all-versions" >> $GITHUB_OUTPUT
            echo "lut_timeout=120" >> $GITHUB_OUTPUT
          else
            echo "lut_args=" >> $GITHUB_OUTPUT
            echo "clut_args=" >> $GITHUB_OUTPUT
            echo "lut_timeout=15" >> $GITHUB_OUTPUT
          fi
          echo "Running in $mode mode"

      # Both steps leave what they finished on disk, so a run that gives up part way
      # still commits its progress and the next one carries on from there.
      - name: Retrieve LUTs
        continue-on-error: true
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: ${{steps.mode.outputs.lut_timeout}}
          max_attempts: 3
          command: |
            ./xiv-dl --verbose lut -s "${{matrix.slug}}" -o "luts/${{matrix.slug}}" -c Brotli ${{steps.mode.outputs.lut_args}}

      # No -c: CLUTs default to version 3 with zstd, which a reader can decode one file
      # out of without inflating the rest.
      - name: Calculate CLUTs
        continue-on-error: true
        run: |
          ./xiv-dl --verbose --debug clut -s "${{matrix.slug}}" -b "luts/${{matrix.slug}}" -o "cluts/${{matrix.slug}}" ${{steps.mode.outputs.clut_args}}

      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Commit Changes
        id: commit
        continue-on-error: true
        env:
          ACTOR: ${{github.actor}}
          NAME: ${{matrix.name}}
        run: |
          rm xiv-dl
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Update Lookups for $NAME" --author="$ACTOR <$ACTOR@users.noreply.github.com>"

      - name: Fetch, Rebase, and Push
        uses: nick-fields/retry@v4
        if: ${{steps.commit.conclusion == 'success'}}
        with:
          timeout_minutes: 2
          max_attempts: 20
          command: |
            git push origin ${{steps.extract_branch.outputs.branch}}
          new_command_on_retry: |
            git stash
            git fetch origin
            git rebase -X theirs origin/${{steps.extract_branch.outputs.branch}}
            git push origin ${{steps.extract_branch.outputs.branch}}
